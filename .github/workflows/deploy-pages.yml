name: Deploy WikiLink Assistant to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare secure static site bundle (No raw secrets or server files)
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_FIRESTORE_DATABASE_ID: ${{ secrets.FIREBASE_FIRESTORE_DATABASE_ID }}
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html logs.html about.html login.html _site/
          cp app.js firebase-client.js words_blacklist.js style.css sw.js manifest.json _site/
          cp icon.svg apple-touch-icon.png pwa-192x192.png pwa-512x512.png pwa-maskable-512x512.png _site/
          cp index.html _site/404.html
          touch _site/.nojekyll
          if [ -n "$FIREBASE_API_KEY" ]; then
            cat <<EOF > _site/firebase-applet-config.json
          {
            "projectId": "${FIREBASE_PROJECT_ID:-gen-lang-client-0146349956}",
            "appId": "${FIREBASE_APP_ID:-1:1062954952450:web:c467b46bb36677d9f7841b}",
            "apiKey": "${FIREBASE_API_KEY}",
            "authDomain": "${FIREBASE_AUTH_DOMAIN:-gen-lang-client-0146349956.firebaseapp.com}",
            "firestoreDatabaseId": "${FIREBASE_FIRESTORE_DATABASE_ID:-ai-studio-wikilinktool-5bf407c8-9bb8-439f-9c90-090f39ca9f91}"
          }
          EOF
          fi

      - name: Publish clean static bundle to gh-pages branch (Fallback & Branch Mode Support)
        id: gh_pages_branch
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "chore(deploy): publish clean static bundle to gh-pages"

      - name: Configure GitHub Pages (Auto-enable if supported)
        id: config_pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Upload Pages artifact
        id: upload_artifact
        if: steps.config_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: './_site'

      - name: Deploy to GitHub Pages API (With Automatic Fallback Handling)
        id: deployment
        if: steps.upload_artifact.outcome == 'success'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deployment Status & Diagnostic Summary
        run: |
          echo "## 🚀 WikiLink Assistant — GitHub Pages Deployment Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.deployment.outcome }}" = "success" ]; then
            echo "- ✅ **GitHub Pages Actions Deployment सफल रहा!**" >> $GITHUB_STEP_SUMMARY
            echo "- 🌐 **Live URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ **`gh-pages` शाखा (Branch) पर सुरक्षित स्थैतिक बंडल सफलतापूर्वक प्रकाशित कर दिया गया है।**" >> $GITHUB_STEP_SUMMARY
            echo "- ℹ️ **नोट (`status: 500` का कारण और समाधान):**" >> $GITHUB_STEP_SUMMARY
            echo "  1. यदि आपकी रिपॉज़िटरी **Private (निजी)** है और आपका खाता **GitHub Free** योजना पर है, तो GitHub की नीति के अनुसार मुफ़्त खाते में Private रिपॉज़िटरी पर GitHub Pages API (`deploy-pages`) `status: 500` देता है। मुफ़्त GitHub Pages चलाने के लिए रिपॉज़िटरी **Public** होनी चाहिए (अथवा GitHub Pro खाता होना चाहिए)।" >> $GITHUB_STEP_SUMMARY
            echo "  2. अपनी रिपॉज़िटरी में **Settings → Pages → Build and deployment → Source** में जाकर **Deploy from a branch** चुनें और शाखा में **`gh-pages` / `/(root)`** चुनकर Save करें, या **GitHub Actions** चुनें।" >> $GITHUB_STEP_SUMMARY
          fi
